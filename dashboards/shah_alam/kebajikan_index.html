
<!DOCTYPE html>
<html>
<head>
  <title>Operanix | Permohonan Kebajikan Shah Alam</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
  <script src="https://unpkg.com/leaflet-pip/leaflet-pip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

  <style>
    body { margin:0; font-family: Arial, sans-serif; }
    #map { width:100%; height:100vh; }
    .pin-red,.pin-green,.pin-blue,.pin-yellow,.pin-white{
      width:14px;height:14px;border-radius:50%;position:relative;
      animation:pulse 1.8s infinite;
    }
    .pin-red{background:#e60000;}
    .pin-yellow{background:#ffcc00;}
    .pin-blue{background:#0066ff;}
    .pin-green{background:#00aa55;}
    .pin-white{background:#ffffff;border:2px solid #666;}
    @keyframes pulse{
      0%{box-shadow:0 0 0 0 rgba(0,0,0,0.4);}
      70%{box-shadow:0 0 0 10px rgba(0,0,0,0);}
      100%{box-shadow:0 0 0 0 rgba(0,0,0,0);}
    }
  </style>
</head>

<body>

<div id="map"></div>

<script>

if(localStorage.getItem("operanix_auth")!=="ok"){
  window.location.href="login.html"
}

/* ===============================
   BASE URL + PARAM FILTER
=============================== */

const BASE_URL = "https://script.google.com/macros/s/AKfycbwsHQjrm7DXKY4ovunQCU1hPm5Iu2IYr2juCPpi-FwTm4P089B46h8FSWN-GyVWaFspcw/exec"

const params = new URLSearchParams(window.location.search)

// default paksa shah alam & KEB
const pusat = (params.get("pusat_khidmat") || "shah alam").toLowerCase()
const type  = (params.get("type") || "KEB").toUpperCase()

const JSON_URL = `${BASE_URL}?pusat_khidmat=${encodeURIComponent(pusat)}&type=${type}`

/* ===============================
   MAP INIT
=============================== */

const GEOJSON_URL="P108_shah_alam.geojson"

const map=L.map('map').setView([3.0738,101.5183],12)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map)

let boundaryLayer,allCases=[],heatLayer
let markerLayer=L.layerGroup().addTo(map)

/* ===============================
   LOAD BOUNDARY
=============================== */

async function loadBoundary(){
  const res=await fetch(GEOJSON_URL)
  const geo=await res.json()
  boundaryLayer=L.geoJSON(geo,{style:{color:"#0044cc",weight:3,fillOpacity:0}}).addTo(map)
  map.fitBounds(boundaryLayer.getBounds())
}

/* ===============================
   DATE FORMAT
=============================== */

function formatMalaysiaDateTime(isoString){
  const options={
    timeZone:"Asia/Kuala_Lumpur",
    day:"2-digit",
    month:"2-digit",
    year:"numeric",
    hour:"2-digit",
    minute:"2-digit",
    hour12:true
  }
  const parts=new Intl.DateTimeFormat("en-GB",options).formatToParts(new Date(isoString))
  const d=parts.find(p=>p.type==="day").value
  const m=parts.find(p=>p.type==="month").value
  const y=parts.find(p=>p.type==="year").value
  const h=parts.find(p=>p.type==="hour").value
  const min=parts.find(p=>p.type==="minute").value
  const ampm=parts.find(p=>p.type==="dayPeriod").value.toUpperCase()
  return { tarikh:`${d}-${m}-${y}`, masa:`${h}:${min} ${ampm}` }
}

/* ===============================
   LOAD JSON (SUDAH FILTER SERVER SIDE)
=============================== */

async function loadJSON(){
  allCases=[]
  const res=await fetch(JSON_URL)
  const data=await res.json()

  data.forEach(item=>{
    if(!item.case_id || !item.case_id.startsWith("KEB")) return

    const {tarikh,masa}=formatMalaysiaDateTime(item.created_at)

    const lat=parseFloat(item.lat)
    const lng=parseFloat(item.lng)
    if(isNaN(lat)||isNaN(lng)) return

    const point=L.latLng(lat,lng)
    const inside=boundaryLayer
      ? leafletPip.pointInLayer(point,boundaryLayer).length>0
      : true

    allCases.push({
      case_id:item.case_id,
      tarikh,
      masa,
      kategori:item.kategori_aduan,
      ringkasan:item.ringkasan_aduan,
      lat,
      lng,
      inside,
      status:item.status_kes,
      urgency:item.urgency
    })
  })
}

/* ===============================
   RENDER MAP
=============================== */

function renderData(){

  markerLayer.clearLayers()
  if(heatLayer) map.removeLayer(heatLayer)

  const heatPoints=allCases.map(c=>[c.lat,c.lng,1])
  heatLayer=L.heatLayer(heatPoints,{radius:40,blur:25,minOpacity:0.4}).addTo(map)

  allCases.forEach(c=>{
    let pinClass="pin-blue"
    if(c.urgency==="sederhana") pinClass="pin-yellow"
    if(c.urgency==="tinggi") pinClass="pin-red"
    if(c.status==="selesai") pinClass="pin-green"
    if(!c.inside) pinClass="pin-white"

    const icon=L.divIcon({
      className:"",
      html:`<div class="${pinClass}"></div>`,
      iconSize:[14,14],
      iconAnchor:[7,7]
    })

    const marker=L.marker([c.lat,c.lng],{icon}).addTo(markerLayer)

    marker.bindPopup(`
      <div style="font-size:13px">
        <div style="color:#555;font-size:12px">
          ${c.tarikh} • ${c.masa}
        </div>
        <b>${c.kategori}</b><br>
        ${c.ringkasan}<br>
        <a href="kebajikan_details.html?case_id=${encodeURIComponent(c.case_id)}" target="_blank">
          Lihat Maklumat Permohonan Lengkap →
        </a>
      </div>
    `)
  })
}

/* ===============================
   INIT
=============================== */

async function init(){
  await loadBoundary()
  await loadJSON()
  renderData()

  setInterval(async()=>{
    await loadJSON()
    renderData()
  },30000)
}

init()

</script>
</body>
</html>
